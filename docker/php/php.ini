; Impostazioni PHP di sviluppo, allineate ai valori verificati in produzione Aruba.
; La visualizzazione degli errori è decisa dall'applicazione (APP_DEBUG).

date.timezone = UTC
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 8M
post_max_size = 10M
expose_php = Off

log_errors = On
display_errors = Off
display_startup_errors = Off

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

opcache.enable = 1
opcache.enable_cli = 0
; In sviluppo i file cambiano di continuo: rivalida sempre.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

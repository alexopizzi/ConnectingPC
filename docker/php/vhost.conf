<VirtualHost *:80>
    ServerName localhost
    # Come in produzione: la document root è public/
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Nulla fuori da public/ deve essere raggiungibile
    # (Apache applica prima le sezioni meno specifiche: public/ resta accessibile)
    <Directory /var/www/html>
        Require all denied
    </Directory>

    ServerSignature Off
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
